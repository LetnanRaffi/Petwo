<script>
        function playInteraction() {
            const heart = document.getElementById('heart-burst');
            heart.style.opacity = '1';
            heart.style.transform = 'translateY(-20px)';
            setTimeout(() => {
                heart.style.opacity = '0';
                heart.style.transform = 'translateY(0px)';
            }, 600);
        }
        const activities = [
            "Partner fed Moci 🍖",
            "Moci is feeling sleepy 💤",
            "You played Fetch! +10 XP 🎾",
            "Moci loves the new room color! ✨"
        ];
        let currentActivity = 0;
        const feedElement = document.querySelector('.activity-scroll');
        setInterval(() => {
            currentActivity = (currentActivity + 1) % activities.length;
            feedElement.style.transition = 'transform 0.5s ease-in-out';
            feedElement.innerHTML = `<p class="font-label-md text-label-md text-on-surface-variant truncate">${activities[currentActivity]}</p>`;
        }, 5000);
    </script>
