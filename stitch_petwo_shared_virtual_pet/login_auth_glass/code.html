<script>
    function simulateLogin() {
      const btn = event.target;
      const originalText = btn.innerText;
      btn.innerText = "Opening the door...";
      btn.disabled = true;
      
      for(let i=0; i<8; i++) {
        setTimeout(createHeart, i * 150);
      }

      setTimeout(() => {
        btn.innerText = "Welcome home!";
        setTimeout(() => {
          btn.innerText = originalText;
          btn.disabled = false;
        }, 1500);
      }, 1000);
    }

    function createHeart() {
      const container = document.getElementById('heart-container');
      const heart = document.createElement('span');
      heart.className = 'material-symbols-outlined absolute text-primary-fixed';
      heart.style.left = Math.random() * 100 + '%';
      heart.style.bottom = '20%';
      heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
      heart.innerText = 'favorite';
      heart.style.opacity = '0.6';
      
      heart.animate([
        { transform: 'translateY(0) scale(0.5)', opacity: 0.6 },
        { transform: `translateY(-200px) translateX(${(Math.random() - 0.5) * 100}px) scale(1.5)`, opacity: 0 }
      ], {
        duration: 2000,
        easing: 'ease-out'
      });

      container.appendChild(heart);
      setTimeout(() => heart.remove(), 2000);
    }

    document.addEventListener('mousemove', (e) => {
      const moveX = (e.clientX - window.innerWidth / 2) * 0.005;
      const moveY = (e.clientY - window.innerHeight / 2) * 0.005;
      const illu = document.querySelector('img[data-alt]');
      if(illu) {
        illu.style.transform = `translate(${moveX}px, ${moveY}px) scale(1.02)`;
      }
    });
  </script>
